 <html>

        <style>
            body{
                background: linear-gradient(135deg, #1a2980, #26d0ce);
                height: 100vh;
            }
            h1{
                text-align: center;
                font-family: Tahoma, sans-serif;
                color: white;
            }
            .container {
              display: grid;
              width: 80vw;
              height: 80vh;
              margin: auto;
              grid-template-columns: 1fr 1fr 1fr;
              grid-template-rows: 1fr 1fr 1fr;
              background-color: Thistle;
              padding: 10px;
              border-radius: 20px;
              border: 8px solid red;
            }
            .heart {
              height: 20vh; /* adjust to control the size */
              aspect-ratio: 1;
              --_m: radial-gradient(#000 69%,#0000 70%) 84.5%/50%;
              -webkit-mask-box-image: var(--_m);
                         mask-border: var(--_m);
              clip-path: polygon(-41% 0,50% 91%, 141% 0);
              background-color: chocolate;
              margin: auto;
            }
            /* HTML: <div class="infinity"></div> */
            .infinity {
              --s: 150px; /* control the size */
              --b: 25px; /* the border thickness */
              display: inline-flex;
              gap: calc((sqrt(2) - 1)*var(--s) - sqrt(2)*var(--b));
            }
            .infinity:before,
            .infinity:after {
              content: "";
              box-shadow: 0 0 0 var(--b) inset #774F38; /* the color */
              height: var(--s);
              aspect-ratio: 1;
              border-radius: 50% 50% 0 50%;
              rotate: -45deg;
            }
            .infinity:after {
              scale: -1;
            }
            /* fallback until better support for mask-border */
            @supports not (-webkit-mask-box-image: var(--_m)) { 
              .heart {
                mask:
                 radial-gradient(at 70% 31%,#000 29%,#0000 30%),
                 radial-gradient(at 30% 31%,#000 29%,#0000 30%),
                 conic-gradient(#000 0 0) bottom/100% 50% no-repeat;
              }
            }
            /* HTML: <div class="matrix-cubes"></div> */
            .matrix-cubes {
              --m: 3; /* number of columns */
              --n: 1; /* number of rows */
              --s: 17px; /* size of the cubes */
              --g: 7px; /* gap between cubes */

              aspect-ratio: var(--m)/var(--n);
              width: calc(var(--m)*(var(--s)*(1 + 1/sqrt(8)) + var(--g)));
              background:
                conic-gradient(at var(--s) var(--s),
                  #0004 37.5%,#0008 0 75%,#0000 0)
                0 0/calc(100%/var(--m)) calc(100%/var(--n))
                #FA6900; /* the main color */
              mask:
                conic-gradient(from -90deg at right var(--g) bottom var(--g),#000 90deg,#0000 0) intersect,
                linear-gradient(to top right,#0000 calc(var(--s)/4 + var(--g)/sqrt(2)),#000 0 calc(100% - calc(var(--s)/4 + var(--g)/sqrt(2))),#0000 0);
              mask-size: calc(100%/var(--m)) calc(100%/var(--n));
            }
            .lilbits{
                grid-column-start: 1;
                grid-row-start: 1;
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                grid-template-rows: 1fr 1fr 1fr;
